# Xenogears PC port configuration (example).  Copy to xenogears-port.cfg in
# the working directory, to ~/.config/xenogears-port/xenogears-port.cfg, or
# point XENO_CONFIG at it.  Every key can be overridden from the
# environment: XENO_<SECTION>_<KEY>, e.g. XENO_VIDEO_WIDTH=1280.

[video]
width = 640          # output window size
height = 480
fullscreen = off
vsync = on
bilinear = off       # bilinear texture filtering
widescreen = off     # 16:9 view (not supported by the PsyCross backend yet)
fps = native         # 60 needs interpolation (not implemented yet)

[game]
speed = 1            # 1..5; fast-forward multiplier (also XENO_SPEED)

[audio]
volume = 100         # 0..100 (not supported by the PsyCross backend yet)

[input]              # SDL key names; defaults depend on the pad layout
# circle = Z
# cross = X
# triangle = V
# square = C
# start = Return
# select = Space

[mods]
enabled = on         # load mods/ (see pc_port/README.md "Mods")
# dir = mods
