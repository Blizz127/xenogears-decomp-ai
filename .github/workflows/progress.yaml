name: Progress Dashboard

# Builds the matching decompilation, generates the objdiff progress report, renders
# the self-contained dashboard (tools/scripts/progress_dashboard.py), and publishes
# it to a SEPARATE PUBLIC repo's gh-pages branch. This keeps THIS decomp repo
# private while the board is public on GitHub Pages -- a decomp.dev-style board for
# this fork alone, distinct from the upstream Xenogears project.
#
# One-time setup:
#   1. Create a public repo to host the board, e.g. Blizz127/xenogears-progress
#      (a bare repo with just a README is fine).
#   2. Create a fine-grained Personal Access Token scoped to ONLY that board repo
#      with "Contents: Read and write", and add it to THIS repo as the secret
#      BOARD_DEPLOY_TOKEN (Settings -> Secrets and variables -> Actions).
#   3. The matching build needs the (copyrighted) game files; this reuses the same
#      secrets as build.yaml: FILE_URL, FILE_URL_2..FILE_URL_5.
#   4. After the first run pushes the gh-pages branch, in the BOARD repo set
#      Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).
#   The board then lives at https://blizz127.github.io/xenogears-progress/
#
# To point at a different board repo, edit BOARD_REPO below.
env:
  BOARD_REPO: Blizz127/xenogears-progress

on:
  push:
    branches: [ ai-private-main, main ]
  workflow_dispatch:

# Only checkout needs the default token; the cross-repo push uses BOARD_DEPLOY_TOKEN.
permissions:
  contents: read

concurrency:
  group: progress-dashboard
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -U -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y make binutils-mips-linux-gnu cpp-mips-linux-gnu

      - name: Fetch game files
        run: |
          curl -L -o disc/SLUS_006.64 "${{ secrets.FILE_URL }}"
          curl -L -o disc/movie.bin "${{ secrets.FILE_URL_2 }}"
          curl -L -o disc/field.bin "${{ secrets.FILE_URL_3 }}"
          curl -L -o disc/member_change_menu.bin "${{ secrets.FILE_URL_4 }}"
          curl -L -o disc/shop_menu.bin "${{ secrets.FILE_URL_5 }}"

      - name: Build (matching)
        run: make build

      - name: Generate progress report
        run: make report

      - name: Render dashboard
        run: |
          mkdir -p _site
          python3 tools/scripts/progress_dashboard.py build/progress.json -o _site/index.html
          cp build/progress.json _site/progress.json
          touch _site/.nojekyll

      - name: Publish to public board repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BOARD_DEPLOY_TOKEN }}
          external_repository: ${{ env.BOARD_REPO }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "progress: ${{ github.sha }}"
