name: Battling Overlay
sha1: 9cfebaf201a0dfd352c11007a63ad7a955533b17
options:
  basename: battling.bin
  target_path: disc/battling.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/battling
  src_path: src/battling
  build_path: build/

  ld_script_path: linker/battling.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False
  # NB: no `generate_asm_macros_files` here.  That is a newer-splat option; the
  # pinned 0.33.2 rejects it, gears ignores splat's nonzero exit, and the whole
  # overlay split silently vanishes (surfacing later as a missing linker script).

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.battling.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - configs/reloc_addrs.battling.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.battling.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.battling.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true

segments:
  - name: battling
    type: code
    start: 0x0
    vram: 0x8006faf0
    bss_size: 0x20000
    align: 4
    subalign: 4
    subsegments:
      # The first 0xCB8 bytes are the overlay's literal/jump-table data.
      # Code begins at 0x800707A8; the 0xCB8 boundary is independently
      # visible in the retail split as the end of D_8006FAF0's data block.
      - [0x0, data]
      - [0xCB8, asm]
      # State 4's entry is externally referenced by SLUS 0x800180CC.
      # Keep the body in generated INCLUDE_ASM until each function is
      # independently decompiled; no host/native implementation is implied.
      - [0x193A0, c, main]
      - { vram: 0x8009295c, type: bss }
  - [0x22e69]
